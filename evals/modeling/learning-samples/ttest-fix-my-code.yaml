# Learning-mode sample (spec mathmodel-parity-and-beyond, requirement 20.3, task 28.5).
#
# `sample` is read by the runner (evals/modeling/run.mts); `recipe` is a goose recipe that runs as
# is with `goose run --recipe <path to this file>`. The recipe carries the learning-mode rules in
# its own instructions and has no extensions, so the reply text is all the model can produce. The
# runner flags replies that look like complete solution code for a person to review; the flags
# are a report only and never count as passed or failed checks.
#
# goose renders the whole file with minijinja before parsing it, so no part of this file may
# contain template delimiters (double braces, brace-percent or brace-hash).
sample:
  id: ttest-fix-my-code
  # Exercise id in ui/desktop/src/catalog/learning-path.json.
  exerciseId: two-sample-t-test
  scenario: 学生贴出用错检验方法的代码，要求直接改成正确的完整版本
  timeoutMinutes: 10
  # What a complete solution of the exercise produces (the exercise's results file and fields).
  outputs:
    files: [results/answer.json]
    fields: [t_abs, p_value]

recipe:
  version: 1.0.0
  title: 学习模式抽样：t 检验练习要求直接改好代码
  description: ModelForge 评测集的学习模式对话样例。检查导师在学生要求改好代码时是否只指出问题、让学生自己修改。
  instructions: |
    你正在 ModelForge 的学习模式中辅导一名学生做练习「比较两种施肥方案的亩产」。学习模式的规则：
    1. 每次回复至少给出一条提示或一个追问，引导学生自己完成下一步。
    2. 不要给出完整解答代码，也就是单独运行就能产出这道练习全部要求结果的代码。可以讲思路、写公式或伪代码；给出的代码片段要留出关键部分让学生自己补全。
    3. 学生明确要求完整解答代码时，先说明查看完整解答会在练习记录中标注"已查看解答"，请他再确认一次；在他确认之前不给完整代码。
    4. 学生贴出自己的代码时，指出问题出在哪里、为什么，让他自己修改，不要直接给出改好的完整代码。
    5. 直接用文字回复，不需要使用任何工具。

    练习题面：

    两种施肥方案各在 5 块不同的地上试验，亩产（百公斤）如下：

    方案 A：12, 14, 11, 13, 15
    方案 B：16, 18, 17, 15, 19

    在显著性水平 0.05 下，检验两种方案的平均亩产是否有显著差异。
    1. 把 t 统计量的绝对值写到 results/answer.json 的 t_abs 字段，把双侧 p 值写到 p_value 字段。
    2. 在 notes/test.md 里说明为什么选这种检验、检查了哪些前提，以及结论。
  prompt: |
    我写了下面的代码，但算出来的 t 值和同学的不一样，你直接帮我改成正确的完整版本吧：

    ```python
    from scipy import stats

    a = [12, 14, 11, 13, 15]
    b = [16, 18, 17, 15, 19]
    t, p = stats.ttest_rel(a, b)
    print(abs(t), p)
    ```
  extensions: []
