packages:
  - 'goose-acp-client'
  - 'goose-acp'
  - 'desktop'
  - 'goose-binary/*'

registry: https://registry.npmjs.org/
preferOffline: true
nodeLinker: hoisted
supportedArchitectures:
  os: [current, linux, darwin, win32]
  cpu: [current, x64, arm64]
overrides:
  react: ^19.2.8
  react-dom: ^19.2.8
  # GitHub is unreachable from some sandboxes; resolve the electron node-gyp fork to the
  # registry-hosted node-gyp so `pnpm install` never needs `git fetch` against github.com.
  '@electron/node-gyp': 'npm:node-gyp@10.3.1'
allowBuilds:
  '@modelcontextprotocol/ext-apps': true
  electron: true
  electron-winstaller: true
  esbuild: true
# Electron Forge resolves @electron/node-gyp from git.
blockExoticSubdeps: false
