name: CI

on:
  push:
    branches:
      - main
      - modelforge
  pull_request:
    branches:
      - main
      - modelforge
      # 规格 mathmodel-parity-and-beyond 的并行分支（mp/*）经 PR 合入这条集成分支
      - feat/mathmodel-parity
  merge_group:
    branches:
      - main
      - modelforge
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.filter.outputs.docs-only }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check for file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # pin@v3
        id: filter
        with:
          filters: |
            docs-only:
              - 'documentation/**'
            code:
              - '!documentation/**'

  goose-acp-npm-packages:
    name: goose ACP npm packages
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: source bin/activate-hermit && pnpm --dir ui install --frozen-lockfile

      - name: Check npm versions
        run: source bin/activate-hermit && node ui/scripts/npm-versions.mjs check

      - name: Test goose-acp
        run: source bin/activate-hermit && pnpm --dir ui/goose-acp test

      - name: Pack npm packages
        run: |
          source bin/activate-hermit
          set -euo pipefail
          client_pack_dir="$RUNNER_TEMP/goose-acp-client"
          wrapper_pack_dir="$RUNNER_TEMP/goose-acp"
          mkdir -p "$client_pack_dir" "$wrapper_pack_dir"

          pnpm --dir ui/goose-acp-client pack --pack-destination "$client_pack_dir"
          pnpm --dir ui/goose-acp pack --pack-destination "$wrapper_pack_dir"

          wrapper_tarball=$(find "$wrapper_pack_dir" -name '*.tgz' -print -quit)
          tar -xzf "$wrapper_tarball" -C "$wrapper_pack_dir"
          node ui/scripts/npm-versions.mjs check-packed-wrapper \
            "$wrapper_pack_dir/package/package.json"

  rust-format:
    name: Check Rust Code Format
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Run cargo fmt
        run: cargo fmt --check

  rust-build-and-test:
    name: Build and Test Rust Project
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    permissions:
      contents: read
      # The watchdog reports through the "rust-watchdog" commit status and the
      # "rust-watchdog-log" check run (see its header).
      statuses: write
      checks: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Repair stale v8 prebuilt marker
        run: .github/scripts/repair-v8-prebuilt.sh

      - name: Install Dependencies
        run: |
          sudo apt update -y
          # gdb: test-binary-runner.sh prints the backtraces of a test binary that hangs.
          sudo apt install -y libdbus-1-dev gnome-keyring libxcb1-dev gdb

      - name: Build and Test
        # A healthy run takes 15-20 minutes. Runs used to end after about 50 with "The hosted
        # runner lost communication with the server" and no log at all: a goose-mcp test killed a
        # process tree through procps-ng's kill(1), which made it kill(-1, SIGKILL) whenever the
        # tree's pid started with 1, and that killed the runner. The watchdog (see its header)
        # records what the machine was doing in the "rust-watchdog" commit status.
        timeout-minutes: 40
        run: |
          gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'foobar'
          export CARGO_INCREMENTAL=0
          set -o pipefail
          : > "$WATCHDOG_TEST_LOG"
          # Own session: a test that kills its process group must not take the watchdog along.
          setsid bash ../.github/scripts/memory-watchdog.sh &
          watchdog=$!
          trap 'kill "$watchdog" 2>/dev/null; wait "$watchdog" 2>/dev/null || true' EXIT
          free -m
          df -h /
          # Build outside the sandbox: the compiler's memory peak is not a test's.
          cargo test --locked --no-run 2>&1 | tee -a "$WATCHDOG_TEST_LOG"
          # The tests run in their own PID namespace and a systemd scope with memory and task
          # limits (see the script), and every test binary under a time limit that names the tests
          # still running when it expires (TEST_BINARY_TIMEOUT_SECS, test-binary-runner.sh). A test
          # that signals every process it can, or runs away with memory, threads or time, now fails
          # this step with its output instead of taking the runner down.
          sandbox=(../.github/scripts/rust-test-sandbox.sh --name rust-tests --)
          "${sandbox[@]}" cargo test --locked -- --skip scenario_tests::scenarios::tests 2>&1 | tee -a "$WATCHDOG_TEST_LOG"
          "${sandbox[@]}" cargo test --locked --jobs 1 scenario_tests::scenarios::tests 2>&1 | tee -a "$WATCHDOG_TEST_LOG"
        working-directory: crates
        env:
          RUST_MIN_STACK: 8388608
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/.github/scripts/test-binary-runner.sh
          # The slowest test binary takes about a minute.
          TEST_BINARY_TIMEOUT_SECS: "600"
          # Not GITHUB_TOKEN: tests must not see a token under a name code may look for.
          # (rust-test-sandbox.sh also keeps it out of the tests' environment.)
          WATCHDOG_TOKEN: ${{ github.token }}
          WATCHDOG_STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WATCHDOG_TEST_LOG: ${{ runner.temp }}/cargo-test.log

  # When the Rust job loses its runner, the watchdog's reports never get a final state. This job
  # runs after it whatever its result and finishes them (see finalize-rust-watchdog.sh).
  rust-watchdog-finalize:
    name: Finalize Rust watchdog reports
    runs-on: ubuntu-latest
    needs: rust-build-and-test
    if: always() && needs.rust-build-and-test.result != 'skipped'
    # Housekeeping only; it never decides the outcome of the run.
    continue-on-error: true
    permissions:
      contents: read
      statuses: write
      checks: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Finalize the rust-watchdog status and rust-watchdog-log check runs
        run: bash .github/scripts/finalize-rust-watchdog.sh
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_RESULT: ${{ needs.rust-build-and-test.result }}

  goose-sdk-uniffi:
    name: Check goose-sdk UniFFI
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libdbus-1-dev libxcb1-dev

      - name: Check UniFFI feature
        run: |
          export CARGO_INCREMENTAL=0
          cargo check -p goose-sdk --features uniffi --locked
          cargo test -p goose-sdk --features uniffi --locked
        env:
          RUST_MIN_STACK: 8388608

  kotlin-gdk-smoke-test:
    name: Test Kotlin GDK package
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/maven-sdk.yml
    with:
      publish: false
      smoke-test: true

  rust-build-and-test-tls:
    name: Build and Test TLS Backend (${{ matrix.tls-feature }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        tls-feature:
          - rustls-tls
          - native-tls
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libdbus-1-dev gnome-keyring libxcb1-dev

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: ${{ matrix.tls-feature }}

      - name: Repair stale v8 prebuilt marker
        run: .github/scripts/repair-v8-prebuilt.sh

      - name: Build and Test with ${{ matrix.tls-feature }}
        run: |
          gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'foobar'
          export CARGO_INCREMENTAL=0
          cargo test -p goose --no-default-features --features ${{ matrix.tls-feature }},code-mode
          cargo test -p goose-providers --no-default-features --features ${{ matrix.tls-feature }}
          cargo test -p goose-cli --no-default-features --features ${{ matrix.tls-feature }},code-mode -- --skip scenario_tests::scenarios::tests
          cargo test -p goose-cli --no-default-features --features ${{ matrix.tls-feature }},code-mode --jobs 1 scenario_tests::scenarios::tests
        env:
          RUST_MIN_STACK: 8388608


  rust-build-and-test-roaming:
    name: Build and Test Roaming Feature
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libdbus-1-dev gnome-keyring libxcb1-dev

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: roaming

      - name: Repair stale v8 prebuilt marker
        run: .github/scripts/repair-v8-prebuilt.sh

      - name: Build and Test with roaming
        run: |
          gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'foobar'
          export CARGO_INCREMENTAL=0
          cargo test -p goose-roaming
          cargo build -p goose-cli --features roaming
          cargo test -p goose-cli --features roaming --test roam_acp_client
        env:
          RUST_MIN_STACK: 8388608

  rust-build-windows:
    name: Build Rust Project on Windows
    runs-on: windows-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/modelforge')
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: windows-ci

      - name: Setup Rust
        shell: bash
        run: |
          rustup show
          rustup target add x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --target x86_64-pc-windows-msvc
        env:
          CARGO_INCREMENTAL: "0"

  rust-msrv:
    name: Check MSRV
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$msrv" ]; then
            echo "Could not find rust-version in workspace Cargo.toml" >&2
            exit 1
          fi
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"
          echo "MSRV: $msrv"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libdbus-1-dev libxcb1-dev

      - name: Repair stale v8 prebuilt marker
        run: .github/scripts/repair-v8-prebuilt.sh

      - name: Check with MSRV toolchain
        run: cargo check --workspace --locked --all-targets
        env:
          CARGO_INCREMENTAL: "0"

  rust-lint:
    name: Lint Rust Code
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Repair stale v8 prebuilt marker
        run: .github/scripts/repair-v8-prebuilt.sh

      - name: Lint
        run: |
          source ./bin/activate-hermit
          # use the non-hermit rust toolchain because the rust-cache action does not
          # play nicely with hermit-managed rust
          hermit uninstall rustup
          export CARGO_INCREMENTAL=0
          cargo clippy --workspace --all-targets --exclude v8 -- -D warnings

  schema-check:
    name: Check Generated Schemas are Up-to-Date
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libdbus-1-dev libxcb1-dev

      - name: Install Node.js Dependencies
        run: |
          source ./bin/activate-hermit
          cd ui/desktop && pnpm install --frozen-lockfile

      - name: Repair stale v8 prebuilt marker
        run: .github/scripts/repair-v8-prebuilt.sh

      - name: Check ACP Artifacts are Up-to-Date
        run: |
          source ./bin/activate-hermit
          just check-acp-artifacts

      - name: Check ACP Client SDK
        run: |
          source ./bin/activate-hermit
          cd ui/goose-acp-client
          pnpm run lint

  gdk-release-config-check:
    name: Check GDK Release Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check GDK crate membership and publication order
        run: python3 crates/goose-sdk/scripts/gdk-release.py check-config

  gdk-api-docs-check:
    name: Check GDK API Reference is Up-to-Date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check generated GDK API reference data
        run: python3 documentation/automation/gdk-api/generate.py --check

  desktop-lint:
    name: Test and Lint Electron Desktop App
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Dependencies
        run: source ../../bin/activate-hermit && pnpm install --frozen-lockfile
        working-directory: ui/desktop

      - name: Run Lint
        run: source ../../bin/activate-hermit && pnpm run lint:check
        working-directory: ui/desktop

      - name: Run Tests
        run: source ../../bin/activate-hermit && pnpm run test:run
        working-directory: ui/desktop

  desktop-updater-install:
    name: Test Desktop Updater Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.10.0

      - name: Install pnpm
        run: npm install -g pnpm@10.30.3

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui/desktop

      - name: Run Updater Install Test
        run: pnpm exec vitest run src/utils/githubUpdater.install.test.ts
        working-directory: ui/desktop
