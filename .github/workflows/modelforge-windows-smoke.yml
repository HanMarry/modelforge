name: "ModelForge Windows smoke"

# Smoke test of the INSTALLED Windows build on a clean machine (spec mathmodel-parity-and-beyond,
# task 13.6; requirements 7.2-7.5 and 7.10). Specs: ui/desktop/tests/e2e/windows-installed-*.spec.ts;
# harness, model stub, PowerShell helpers and summary script: ui/desktop/tests/e2e/windows-smoke/.
#
# Where the installer comes from, and in which order things run
#   This workflow does not build anything. It tests the `ModelForge-win32-x64-setup` artifact of a
#   successful "Package ModelForge (Windows)" run (package-windows.yml), so packaging comes first:
#     - automatically: package-windows.yml succeeds on `modelforge` (push) -> workflow_run starts
#       this workflow. GitHub then uses the copy of this file on the default branch and the specs
#       of the packaged commit.
#     - by hand, on any branch:
#         gh workflow run package-windows.yml --ref <branch>
#         gh run watch <package run id>
#         gh workflow run modelforge-windows-smoke.yml --ref <branch> [-f package_run_id=<id>] [-f wizard_strict=false]
#       Without package_run_id the newest successful package run of <branch> is used. The specs
#       come from <branch>, so they can be changed and rerun against an existing installer
#       without packaging again (the summary warns when the two commits differ).
#
# Wizard step 2, strict by default
#   The onboarding wizard has to save the stub provider (address, model, key) in the built-in
#   kernel, and the chat, Python, paper and upgrade flows run on that configuration alone; the
#   harness supplies nothing (MODELFORGE_SMOKE_WIZARD_STRICT=1). Automatic runs are always strict.
#   A manual run with wizard_strict=false makes the wizard checks soft and lets the harness stand
#   in for a missing configuration (reported as harness-substitution), so the later flows are
#   still covered while the wizard is broken.
#
# Machine under test vs. test runner
#   - Machine under test (what the installed app can reach): the app is started with a PATH of the
#     Windows system directories plus Python (setup-python) and Typst (pinned zip) only. The runner
#     image's Rust (rustup/cargo in the runner profile) and Node (Program Files\nodejs) are moved
#     away first, and no ACP adapter (codex-acp, claude-code-acp, ...) may be installed globally.
#     The first spec checks the app's PATH for all of these.
#   - Test runner: Node from setup-node plus @playwright/test, installed in $RUNNER_TEMP\mf-harness
#     outside the checkout. Only Playwright, the loopback model stub and the summary script use it;
#     its directory is never on the app's PATH.
#
# Scenarios (one Playwright run each; results in $RUNNER_TEMP\mf-results\<scenario>)
#   primary         install to a directory with Chinese characters and a space; main spec (7.2-7.4)
#   upgrade         reinstall over it: configuration, sessions, Projects and keys are kept (7.5)
#   uninstall       silent / keep / remove through the uninstaller and its dialogs (7.10)
#   cn-user         new local user whose profile path has Chinese characters and a space,
#                   per-user install at the default location; main spec (7.4), then the
#                   uninstall spec on that user's own %APPDATA% / %LOCALAPPDATA% (7.10)
#   cn-profile-sim  only when no process can run as that user: stand-in profile directory,
#                   same two specs; the uninstaller gets the stand-in profile variables
#   A manual run can pick some of them (scenarios=cn-user, for example); upgrade and uninstall
#   continue from primary. No test is retried and a crashed installer is not run again, unless
#   installer_crash_retries allows it for installers built before build/modelforge-multiuser.nsh.
#
# Installer crash check (job crash-check, manual runs with crash_check_rounds > 0)
#   Installers built with electron-builder 24.13.3's multiUser.nsh crash at random on a fresh
#   per-user install (0xC0000005 in System.dll); build/modelforge-multiuser.nsh fixes that. The
#   job installs the candidate (package_run_id) and optionally a baseline installer
#   (crash_check_baseline_run_id) over and over as the new local user, without reruns, then again
#   under full page heap, which turns the out-of-bounds read into a crash on every run, and
#   reports crashes, faulting module and offset, dumps and which code each installer was compiled
#   with (scripts/Test-InstallerCrashes.ps1). scenarios=none skips the smoke job.
on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: 'Run id of a successful "Package ModelForge (Windows)" run (empty: newest successful run of this branch)'
        required: false
        default: ''
        type: string
      wizard_strict:
        description: 'Wizard step 2 strict: hard assertions and no harness fallback for the later flows. Turn off only to keep the later flows running while the wizard is broken'
        required: false
        default: true
        type: boolean
      scenarios:
        description: 'Scenarios, comma-separated: primary,upgrade,uninstall,cn-user (cn-user includes cn-user-uninstall; upgrade and uninstall need primary); none: crash check only'
        required: false
        default: 'primary,upgrade,uninstall,cn-user'
        type: string
      installer_crash_retries:
        description: 'Reruns of an installer that crashed (0: a crash fails the scenario). Only for packages built before build/modelforge-multiuser.nsh'
        required: false
        default: '0'
        type: string
      crash_check_rounds:
        description: 'Installer crash check: fresh per-user installs per installer (0: no crash check)'
        required: false
        default: '0'
        type: string
      crash_check_page_heap_rounds:
        description: 'Installer crash check: further installs per installer under full page heap'
        required: false
        default: '5'
        type: string
      crash_check_baseline_run_id:
        description: 'Installer crash check: package run of the installer to compare with (empty: candidate only)'
        required: false
        default: ''
        type: string
  workflow_run:
    workflows: ["Package ModelForge (Windows)"]
    types: [completed]
    branches: [modelforge]

permissions:
  contents: read
  # Reading the packaging run and downloading its artifact.
  actions: read

# One run at a time per branch and installer; a crash check (scenarios=none) runs beside a smoke.
concurrency:
  group: modelforge-windows-smoke-${{ github.event.workflow_run.head_branch || github.ref_name }}-${{ inputs.package_run_id }}-${{ inputs.scenarios == 'none' && 'crash-check' || 'smoke' }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Install and smoke (Windows)
    runs-on: windows-latest
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.scenarios != 'none') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository) }}
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    env:
      TYPST_VERSION: '0.15.1'
      TYPST_SHA256: '19ce3551153c2fe7ee9fa2f95208310c8f4d3209fedb699e0333faf8913f6736'
      MODELFORGE_STUB_PORT: '47372'
      MODELFORGE_SMOKE_LOCALE: zh-CN
      # Strict unless a manual run turned wizard_strict off (workflow_run has no inputs).
      MODELFORGE_SMOKE_WIZARD_STRICT: ${{ (github.event_name != 'workflow_dispatch' || inputs.wizard_strict) && '1' || '0' }}
      # All scenarios unless a manual run picked some (workflow_run has no inputs).
      SMOKE_SCENARIOS: ${{ inputs.scenarios || 'primary,upgrade,uninstall,cn-user' }}
      # Read by Install-ModelForge.ps1 wherever it runs (workflow steps, specs, the cn-user run).
      MODELFORGE_SMOKE_INSTALLER_CRASH_RETRIES: ${{ inputs.installer_crash_retries || '0' }}
      # Requirement 7.4: Chinese characters and a space in the install and profile paths.
      SMOKE_INSTALL_DIR: 'C:\模型 工具\ModelForge'
      SMOKE_USER_NAME: '模型 测试'
      SMOKE_SIM_PROFILE: 'C:\Users\模型 模拟'
      SMOKE_TEST_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      CI: '1'
      FORCE_COLOR: '0'
    steps:
      # ------------------------------------------------------------------ installer and specs
      - name: Resolve the packaging run to test
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID_INPUT: ${{ inputs.package_run_id }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          if ($env:EVENT_NAME -eq 'workflow_run') {
            $id = $env:WORKFLOW_RUN_ID
            $sha = $env:WORKFLOW_RUN_SHA
          }
          else {
            if ($env:RUN_ID_INPUT) {
              $id = $env:RUN_ID_INPUT.Trim()
              if ($id -notmatch '^\d+$') { throw "package_run_id must be a run id (digits): $id" }
            }
            else {
              $list = gh run list -R $repo --workflow package-windows.yml --branch $env:BRANCH --status success --limit 1 --json databaseId | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or -not $list) {
                throw "no successful package-windows.yml run on $($env:BRANCH); start one with: gh workflow run package-windows.yml --ref $($env:BRANCH)"
              }
              $id = [string]$list[0].databaseId
            }
            $run = gh run view $id -R $repo --json conclusion,headSha,headBranch,workflowName | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $run) { throw "cannot read run $id" }
            if ($run.workflowName -ne 'Package ModelForge (Windows)') { throw "run $id belongs to '$($run.workflowName)', not to package-windows.yml" }
            if ($run.conclusion -ne 'success') { throw "package run $id concluded '$($run.conclusion)'" }
            $sha = $run.headSha
            Write-Host "package run $id built $($run.headBranch) at $sha"
          }
          $url = "$($env:GITHUB_SERVER_URL)/$repo/actions/runs/$id"
          "run_id=$id", "sha=$sha", "url=$url" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Plan the scenarios
        id: plan
        run: |
          $known = 'primary', 'upgrade', 'uninstall', 'cn-user'
          $wanted = @($env:SMOKE_SCENARIOS -split ',' | ForEach-Object { $_.Trim().ToLowerInvariant() } | Where-Object { $_ })
          $unknown = @($wanted | Where-Object { $known -notcontains $_ })
          if ($unknown.Count -gt 0) { throw "unknown scenario(s) $($unknown -join ', '); known: $($known -join ', ')" }
          if ($wanted.Count -eq 0) { throw 'no scenario selected' }
          if ((($wanted -contains 'upgrade') -or ($wanted -contains 'uninstall')) -and ($wanted -notcontains 'primary')) {
            throw 'upgrade and uninstall continue from the primary scenario (its install, profile and Project); add primary'
          }
          $retries = 0
          if (-not [int]::TryParse($env:MODELFORGE_SMOKE_INSTALLER_CRASH_RETRIES, [ref] $retries) -or $retries -lt 0) {
            throw "installer_crash_retries must be a whole number, not '$($env:MODELFORGE_SMOKE_INSTALLER_CRASH_RETRIES)'"
          }
          foreach ($name in $known) {
            $run = if ($wanted -contains $name) { 'true' } else { 'false' }
            "$($name -replace '-', '_')=$run" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          }
          Write-Host "scenarios: $($wanted -join ', '); reruns after an installer crash: $retries"
          if ($retries -gt 0) {
            Write-Host "::warning::installer_crash_retries=$($retries): a crashed installer is run again; the summary lists every crash"
          }

      - name: Checkout the specs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.SMOKE_TEST_SHA }}
          persist-credentials: false

      - name: Download the installer of the packaging run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ModelForge-win32-x64-setup
          path: ${{ runner.temp }}\installer
          run-id: ${{ steps.package.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Locate the installer and prepare directories
        run: |
          $installer = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'installer') -Recurse -File -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer (*Setup*.exe) not found in the artifact' }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host ("installer {0}, {1:N0} bytes, sha256 {2}" -f $installer.FullName, $installer.Length, $hash)
          $results = Join-Path $env:RUNNER_TEMP 'mf-results'
          $harness = Join-Path $env:RUNNER_TEMP 'mf-harness'
          $tools = Join-Path $env:RUNNER_TEMP 'mf-tools'
          foreach ($dir in @($results, $harness, $tools)) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
          @(
            "MODELFORGE_INSTALLER=$($installer.FullName)"
            "SMOKE_INSTALLER=$($installer.FullName)"
            "SMOKE_INSTALLER_DIR=$($installer.DirectoryName)"
            "SMOKE_RESULTS=$results"
            "SMOKE_HARNESS=$harness"
            "SMOKE_TOOLS=$tools"
            "SMOKE_SCRIPTS=$(Join-Path $harness 'tests\e2e\windows-smoke\scripts')"
            "SMOKE_PS51=$(Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe')"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      # ------------------------------------------------------------------ test runner (not on the app's PATH)
      - name: Set up Node.js (test runner only)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.10.0

      - name: Install the Playwright harness outside the checkout
        run: |
          # Same Playwright as the desktop package (ui/pnpm-lock.yaml), pinned exactly.
          $lock = Get-Content -LiteralPath ui/pnpm-lock.yaml -Raw
          $match = [regex]::Match($lock, "(?m)^  '@playwright/test@([0-9]+\.[0-9]+\.[0-9]+)':")
          if (-not $match.Success) { throw 'cannot find @playwright/test in ui/pnpm-lock.yaml' }
          $version = $match.Groups[1].Value
          $e2e = Join-Path $env:SMOKE_HARNESS 'tests\e2e'
          New-Item -ItemType Directory -Force -Path $e2e | Out-Null
          Copy-Item -Path ui/desktop/tests/e2e/windows-installed-*.spec.ts -Destination $e2e
          Copy-Item -Path ui/desktop/tests/e2e/windows-smoke -Destination $e2e -Recurse
          New-Item -ItemType Directory -Force -Path (Join-Path $env:SMOKE_HARNESS 'run') | Out-Null
          # A CommonJS package, so harness.ts can use __dirname.
          [ordered]@{ name = 'modelforge-windows-smoke-harness'; private = $true; dependencies = [ordered]@{ '@playwright/test' = $version } } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:SMOKE_HARNESS 'package.json') -Encoding utf8
          Push-Location $env:SMOKE_HARNESS
          try {
            npm install --no-audit --no-fund --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
            node --check tests/e2e/windows-smoke/openai-stub.cjs
            if ($LASTEXITCODE -ne 0) { throw 'openai-stub.cjs does not parse' }
            # The specs must load; connectOverCDP needs no downloaded browser.
            $env:MODELFORGE_SMOKE_RESULTS_DIR = Join-Path $env:RUNNER_TEMP 'mf-list'
            node node_modules/@playwright/test/cli.js test -c tests/e2e/windows-smoke/playwright.config.ts --list --reporter=list
            if ($LASTEXITCODE -ne 0) { throw 'the smoke specs do not load' }
          }
          finally { Pop-Location }
          $node = (Get-Command node).Source
          Write-Host "test runner: node $(node --version) at $node, @playwright/test $version"
          "SMOKE_NODE=$node" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      # ------------------------------------------------------------------ machine under test
      - name: Set up Python (optional runtime the app detects)
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Typst ${{ env.TYPST_VERSION }} (optional paper compiler the app detects)
        run: |
          $zip = Join-Path $env:SMOKE_TOOLS 'typst.zip'
          $url = "https://github.com/typst/typst/releases/download/v$($env:TYPST_VERSION)/typst-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:TYPST_SHA256) { throw "typst zip sha256 $hash does not match the pinned $($env:TYPST_SHA256)" }
          $dir = Join-Path $env:SMOKE_TOOLS 'typst'
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -LiteralPath $dir -Recurse -File -Filter typst.exe | Select-Object -First 1
          if (-not $exe) { throw 'typst.exe is not in the archive' }
          & $exe.FullName --version
          "SMOKE_TYPST_DIR=$($exe.DirectoryName)" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Remove developer tools from the machine under test and build the app's PATH
        env:
          PYTHON_EXE: ${{ steps.python.outputs.python-path }}
        run: |
          # Rust of the runner image and the image's own Node. The test runner's Node lives in the
          # tool cache and stays; it is never on the app's PATH.
          $hide = @($env:CARGO_HOME, $env:RUSTUP_HOME, (Join-Path $env:USERPROFILE '.cargo'), (Join-Path $env:USERPROFILE '.rustup'),
                    (Join-Path $env:ProgramFiles 'nodejs')) | Where-Object { $_ } | Select-Object -Unique
          foreach ($dir in $hide) {
            if (-not (Test-Path -LiteralPath $dir)) { continue }
            try {
              Rename-Item -LiteralPath $dir -NewName ((Split-Path -Leaf $dir) + '.hidden-by-smoke')
              Write-Host "moved away: $dir"
            }
            catch { Write-Host "::warning::could not move $dir away: $($_.Exception.Message)" }
          }
          # No ACP adapter or agent CLI installed globally (npm prefixes of the image and the user).
          $names = 'codex', 'codex-acp', 'claude', 'claude-code-acp', 'claude-agent-acp'
          $prefixes = @('C:\npm\prefix', (Join-Path $env:APPDATA 'npm')) | Where-Object { Test-Path -LiteralPath $_ }
          foreach ($prefix in $prefixes) {
            foreach ($file in Get-ChildItem -LiteralPath $prefix -File -ErrorAction SilentlyContinue) {
              if ($names -contains $file.BaseName) {
                Remove-Item -LiteralPath $file.FullName -Force
                Write-Host "::warning::removed global $($file.FullName)"
              }
            }
          }
          # What a student machine has: the Windows directories, Python and Typst.
          $python = Split-Path -Parent $env:PYTHON_EXE
          $system = Join-Path $env:SystemRoot 'System32'
          $appPath = @($system, $env:SystemRoot, (Join-Path $system 'Wbem'), (Join-Path $system 'WindowsPowerShell\v1.0'),
                       (Join-Path $system 'OpenSSH'), $python, (Join-Path $python 'Scripts'), $env:SMOKE_TYPST_DIR) -join ';'
          Write-Host "app PATH: $appPath"
          "MODELFORGE_SMOKE_APP_PATH=$appPath", "SMOKE_PYTHON_DIR=$python" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Start the loopback model stub
        run: |
          $dir = Join-Path $env:SMOKE_RESULTS 'stub'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $env:MODELFORGE_STUB_LOG = Join-Path $dir 'requests.jsonl'
          $env:MODELFORGE_STUB_CONSOLE_LOG = Join-Path $dir 'stub.log'
          $stub = Join-Path $env:SMOKE_HARNESS 'tests\e2e\windows-smoke\openai-stub.cjs'
          # Detached; it keeps running for the later steps and is cleaned up with the job.
          $process = Start-Process -FilePath $env:SMOKE_NODE -ArgumentList ('"{0}"' -f $stub) -WindowStyle Hidden -PassThru
          $healthy = $false
          for ($i = 0; $i -lt 60 -and -not $healthy; $i++) {
            try {
              $healthy = (Invoke-WebRequest -Uri "http://127.0.0.1:$($env:MODELFORGE_STUB_PORT)/__health" -UseBasicParsing -TimeoutSec 2).StatusCode -eq 200
            }
            catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $healthy) { throw "the stub (pid $($process.Id)) did not answer on port $($env:MODELFORGE_STUB_PORT)" }
          Write-Host "stub up (pid $($process.Id)) on 127.0.0.1:$($env:MODELFORGE_STUB_PORT)"

      # ------------------------------------------------------------------ scenario primary, upgrade, uninstall
      - name: "Scenario primary: install to a path with Chinese characters and a space"
        id: install_primary
        if: steps.plan.outputs.primary == 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          $result = Join-Path $env:SMOKE_RESULTS 'primary\evidence\Install-ModelForge-primary.json'
          & $env:SMOKE_PS51 -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $env:SMOKE_SCRIPTS 'Install-ModelForge.ps1') `
            -Installer $env:MODELFORGE_INSTALLER -InstallDir $env:SMOKE_INSTALL_DIR -ResultFile $result
          if ($LASTEXITCODE -ne 0) { throw "Install-ModelForge.ps1 exited with $LASTEXITCODE" }

      - name: "Scenario primary: installed-app smoke"
        id: primary
        if: steps.plan.outputs.primary == 'true' && steps.install_primary.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 60
        working-directory: ${{ env.SMOKE_HARNESS }}
        env:
          MODELFORGE_INSTALL_DIR: ${{ env.SMOKE_INSTALL_DIR }}
          MODELFORGE_SMOKE_SCENARIO: primary
          # The diagnostics center has to name the packaged commit (phase-1 entry check).
          MODELFORGE_SMOKE_PACKAGE_SHA: ${{ steps.package.outputs.sha }}
        run: |
          $out = Join-Path $env:SMOKE_RESULTS 'primary'
          $env:MODELFORGE_SMOKE_RESULTS_DIR = $out
          $env:MODELFORGE_SMOKE_EVIDENCE_DIR = Join-Path $out 'evidence'
          $env:MODELFORGE_SMOKE_STATE_DIR = Join-Path $env:SMOKE_RESULTS 'state-primary'
          node node_modules/@playwright/test/cli.js test -c tests/e2e/windows-smoke/playwright.config.ts windows-installed-smoke

      - name: "Scenario upgrade: reinstall keeps the user's data"
        id: upgrade
        if: steps.plan.outputs.upgrade == 'true' && steps.install_primary.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 40
        working-directory: ${{ env.SMOKE_HARNESS }}
        env:
          MODELFORGE_INSTALL_DIR: ${{ env.SMOKE_INSTALL_DIR }}
          MODELFORGE_SMOKE_SCENARIO: primary
        run: |
          $out = Join-Path $env:SMOKE_RESULTS 'upgrade'
          $env:MODELFORGE_SMOKE_RESULTS_DIR = $out
          $env:MODELFORGE_SMOKE_EVIDENCE_DIR = Join-Path $out 'evidence'
          # Same profile and Project as the primary scenario.
          $env:MODELFORGE_SMOKE_STATE_DIR = Join-Path $env:SMOKE_RESULTS 'state-primary'
          node node_modules/@playwright/test/cli.js test -c tests/e2e/windows-smoke/playwright.config.ts windows-installed-upgrade

      - name: "Scenario uninstall: silent, keep data, remove data"
        id: uninstall
        if: steps.plan.outputs.uninstall == 'true' && steps.install_primary.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 45
        working-directory: ${{ env.SMOKE_HARNESS }}
        env:
          MODELFORGE_INSTALL_DIR: ${{ env.SMOKE_INSTALL_DIR }}
          MODELFORGE_SMOKE_SCENARIO: primary
        run: |
          $out = Join-Path $env:SMOKE_RESULTS 'uninstall'
          $env:MODELFORGE_SMOKE_RESULTS_DIR = $out
          $env:MODELFORGE_SMOKE_EVIDENCE_DIR = Join-Path $out 'evidence'
          $env:MODELFORGE_SMOKE_STATE_DIR = Join-Path $env:SMOKE_RESULTS 'state-primary'
          node node_modules/@playwright/test/cli.js test -c tests/e2e/windows-smoke/playwright.config.ts windows-installed-uninstall

      # ------------------------------------------------------------------ scenario cn-user (fallback cn-profile-sim)
      - name: "Scenario cn-user: new local user with Chinese characters and a space in the profile path"
        id: cn_user
        if: steps.plan.outputs.cn_user == 'true'
        continue-on-error: true
        timeout-minutes: 120
        run: |
          $out = Join-Path $env:SMOKE_RESULTS 'cn-user'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # Read by Run-AsUserInner.ps1 as the new user (see that script for the format).
          $spec = [ordered]@{
            installer  = $env:MODELFORGE_INSTALLER
            harnessDir = $env:SMOKE_HARNESS
            node       = $env:SMOKE_NODE
            # The uninstall spec runs last and on this user's data (Run-AsUserInner.ps1 sets the
            # profile variables from the user's logon token; the uninstaller inherits them).
            specs      = @('windows-installed-smoke', 'windows-installed-uninstall')
            resultsDir = $out
            env        = [ordered]@{
              MODELFORGE_SMOKE_APP_PATH      = $env:MODELFORGE_SMOKE_APP_PATH
              MODELFORGE_STUB_PORT           = $env:MODELFORGE_STUB_PORT
              MODELFORGE_SMOKE_LOCALE        = $env:MODELFORGE_SMOKE_LOCALE
              MODELFORGE_SMOKE_WIZARD_STRICT = $env:MODELFORGE_SMOKE_WIZARD_STRICT
              MODELFORGE_SMOKE_INSTALLER_CRASH_RETRIES = $env:MODELFORGE_SMOKE_INSTALLER_CRASH_RETRIES
            }
          }
          $envFile = Join-Path $env:SMOKE_HARNESS 'run\cn-user-env.json'
          $spec | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $envFile -Encoding utf8
          $read = @($env:SMOKE_HARNESS, (Split-Path -Parent $env:SMOKE_NODE), $env:SMOKE_INSTALLER_DIR, $env:SMOKE_PYTHON_DIR, $env:SMOKE_TYPST_DIR) -join ';'
          & $env:SMOKE_PS51 -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $env:SMOKE_SCRIPTS 'Invoke-AsLocalUser.ps1') `
            -UserName $env:SMOKE_USER_NAME -EnvFile $envFile -GrantRead $read -GrantModify $out `
            -ResultFile (Join-Path $out 'invoke-result.json') -TimeoutSeconds 6600
          $code = $LASTEXITCODE
          "code=$code" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          # The run as the user has no console here; show what it wrote.
          foreach ($name in 'inner.log', 'playwright.out.log', 'playwright.err.log') {
            $file = Join-Path $out $name
            if (Test-Path -LiteralPath $file) {
              Write-Host "----- $name"
              Get-Content -LiteralPath $file -Encoding utf8 -Tail 400
            }
          }
          if ($code -eq 3) {
            Write-Host '::warning::No process could run as the new local user; the cn-profile-sim fallback runs instead (requirement 7.4 is then only simulated).'
            exit 0
          }
          exit $code

      - name: "Scenario cn-profile-sim: fallback with a stand-in profile directory"
        id: cn_profile_sim
        if: steps.cn_user.outputs.code == '3'
        continue-on-error: true
        timeout-minutes: 90
        working-directory: ${{ env.SMOKE_HARNESS }}
        env:
          MODELFORGE_SMOKE_SCENARIO: cn-profile-sim
          MODELFORGE_SMOKE_PROFILE_ROOT: ${{ env.SMOKE_SIM_PROFILE }}
        run: |
          $out = Join-Path $env:SMOKE_RESULTS 'cn-profile-sim'
          $installDir = Join-Path $env:SMOKE_SIM_PROFILE 'AppData\Local\Programs\ModelForge'
          & $env:SMOKE_PS51 -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $env:SMOKE_SCRIPTS 'Install-ModelForge.ps1') `
            -Installer $env:MODELFORGE_INSTALLER -InstallDir $installDir -ResultFile (Join-Path $out 'evidence\Install-ModelForge-cn-profile-sim.json')
          if ($LASTEXITCODE -ne 0) { throw "Install-ModelForge.ps1 exited with $LASTEXITCODE" }
          $env:MODELFORGE_INSTALL_DIR = $installDir
          $env:MODELFORGE_SMOKE_RESULTS_DIR = $out
          $env:MODELFORGE_SMOKE_EVIDENCE_DIR = Join-Path $out 'evidence'
          $env:MODELFORGE_SMOKE_STATE_DIR = Join-Path $env:SMOKE_RESULTS 'state-cn-profile-sim'
          # The uninstall spec hands the stand-in profile variables to the uninstaller (profileEnv).
          node node_modules/@playwright/test/cli.js test -c tests/e2e/windows-smoke/playwright.config.ts windows-installed-smoke windows-installed-uninstall

      # ------------------------------------------------------------------ evidence, summary, verdict
      - name: Collect app and kernel logs
        if: always() && env.SMOKE_RESULTS != ''
        run: |
          $logs = Join-Path $env:SMOKE_RESULTS 'logs'
          $cnProfile = Get-CimInstance Win32_UserProfile -ErrorAction SilentlyContinue |
            Where-Object { (Split-Path -Leaf $_.LocalPath) -eq $env:SMOKE_USER_NAME } | Select-Object -First 1 -ExpandProperty LocalPath
          $profiles = [ordered]@{ 'runner' = $env:USERPROFILE; 'cn-user' = $cnProfile; 'cn-profile-sim' = $env:SMOKE_SIM_PROFILE }
          # A profile whose uninstall spec answered "remove" has none of these left; that spec
          # copies them to <scenario>\evidence\before-remove first.
          # Never the credential store (agent-kernel-secrets.json).
          $items = [ordered]@{
            'AppData\Roaming\ModelForge\logs'                 = 'desktop-logs'
            'AppData\Roaming\ModelForge\settings.json'        = 'settings.json'
            'AppData\Roaming\Block\goose\data\logs'           = 'kernel-logs'
            'AppData\Roaming\Block\goose\config\config.yaml'  = 'config.yaml'
          }
          foreach ($entry in $profiles.GetEnumerator()) {
            if (-not $entry.Value -or -not (Test-Path -LiteralPath $entry.Value)) { continue }
            foreach ($item in $items.GetEnumerator()) {
              $source = Join-Path $entry.Value $item.Key
              if (-not (Test-Path -LiteralPath $source)) { continue }
              $target = Join-Path $logs $entry.Key
              New-Item -ItemType Directory -Force -Path $target | Out-Null
              Copy-Item -LiteralPath $source -Destination (Join-Path $target $item.Value) -Recurse -Force -ErrorAction Continue
            }
          }
          # Crashes and hangs of node.exe (Playwright and its workers), ModelForge.exe, goose.exe or
          # the uninstaller, with the faulting module and exception code. Run 36686960299 lost a
          # Playwright worker with 0xC0000409 and no other trace.
          try {
            $filter = @{
              LogName      = 'Application'
              ProviderName = 'Application Error', 'Application Hang', 'Windows Error Reporting'
              StartTime    = (Get-Date).AddHours(-6)
            }
            $events = @(Get-WinEvent -FilterHashtable $filter -MaxEvents 200 -ErrorAction Stop | Sort-Object TimeCreated)
            New-Item -ItemType Directory -Force -Path $logs | Out-Null
            $events | ForEach-Object { "[{0:o}] {1} {2}`n{3}`n" -f $_.TimeCreated, $_.ProviderName, $_.Id, $_.Message } |
              Set-Content -LiteralPath (Join-Path $logs 'application-errors.txt') -Encoding utf8
            Write-Host ("{0} crash/hang events saved to logs\application-errors.txt" -f $events.Count)
          }
          catch {
            Write-Host "no crash/hang events in the Application log: $($_.Exception.Message)"
          }

      - name: Summarize
        if: always()
        env:
          SMOKE_PACKAGE_RUN_ID: ${{ steps.package.outputs.run_id }}
          SMOKE_PACKAGE_RUN_URL: ${{ steps.package.outputs.url }}
          SMOKE_PACKAGE_SHA: ${{ steps.package.outputs.sha }}
          SMOKE_STEP_OUTCOMES: >-
            install primary=${{ steps.install_primary.outcome }};primary=${{ steps.primary.outcome }};upgrade=${{ steps.upgrade.outcome }};uninstall=${{ steps.uninstall.outcome }};cn-user=${{ steps.cn_user.outcome }};cn-profile-sim=${{ steps.cn_profile_sim.outcome }}
        run: |
          if (-not $env:SMOKE_RESULTS) {
            "## ModelForge Windows smoke`n`nStopped before any scenario ran; see the job log." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            exit 0
          }
          $node = if ($env:SMOKE_NODE) { $env:SMOKE_NODE } else { 'node' }
          & $node (Join-Path $env:GITHUB_WORKSPACE 'ui/desktop/tests/e2e/windows-smoke/summarize-results.cjs') --results $env:SMOKE_RESULTS

      - name: Fail the job when a scenario failed
        if: always()
        env:
          OUTCOMES: >-
            install primary=${{ steps.install_primary.outcome }};primary=${{ steps.primary.outcome }};upgrade=${{ steps.upgrade.outcome }};uninstall=${{ steps.uninstall.outcome }};cn-user=${{ steps.cn_user.outcome }};cn-profile-sim=${{ steps.cn_profile_sim.outcome }}
        run: |
          $failed = @()
          foreach ($pair in $env:OUTCOMES -split ';') {
            $name, $outcome = $pair -split '=', 2
            if ($outcome -eq 'failure') { $failed += $name.Trim() }
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::failed scenario steps: $($failed -join ', ')"
            exit 1
          }
          Write-Host 'all scenario steps that ran passed'

      # Uploaded on success too (evidence for acceptance); on failure it holds the screenshots,
      # app/kernel logs, Playwright reports, helper JSON results and the stub's request log.
      - name: Upload screenshots, logs and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: modelforge-windows-smoke
          path: ${{ env.SMOKE_RESULTS || format('{0}\mf-results', runner.temp) }}
          if-no-files-found: warn
          retention-days: 14

  crash-check:
    name: Installer crash check (Windows)
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.crash_check_rounds != '' && inputs.crash_check_rounds != '0' }}
    timeout-minutes: 200
    defaults:
      run:
        shell: pwsh
    env:
      # The same new local user as the cn-user scenario (requirement 7.4).
      SMOKE_USER_NAME: '模型 测试'
      CI: '1'
    steps:
      - name: Resolve the installers to compare
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID_INPUT: ${{ inputs.package_run_id }}
          BASELINE_INPUT: ${{ inputs.crash_check_baseline_run_id }}
          ROUNDS: ${{ inputs.crash_check_rounds }}
          PAGE_HEAP_ROUNDS: ${{ inputs.crash_check_page_heap_rounds }}
          BRANCH: ${{ github.ref_name }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          foreach ($name in 'ROUNDS', 'PAGE_HEAP_ROUNDS') {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value -notmatch '^\d+$') { throw "$name must be a whole number, not '$value'" }
          }
          function Resolve-PackageRun([string] $id) {
            if ($id -notmatch '^\d+$') { throw "a package run id is digits: $id" }
            $run = gh run view $id -R $repo --json conclusion,headSha,workflowName | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $run) { throw "cannot read run $id" }
            if ($run.workflowName -ne 'Package ModelForge (Windows)') { throw "run $id belongs to '$($run.workflowName)'" }
            if ($run.conclusion -ne 'success') { throw "package run $id concluded '$($run.conclusion)'" }
            return $run.headSha
          }
          # An empty input arrives as an unset variable.
          $candidate = ([string]$env:RUN_ID_INPUT).Trim()
          if (-not $candidate) {
            $list = gh run list -R $repo --workflow package-windows.yml --branch $env:BRANCH --status success --limit 1 --json databaseId | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $list) { throw "no successful package-windows.yml run on $($env:BRANCH)" }
            $candidate = [string]$list[0].databaseId
          }
          $candidateSha = Resolve-PackageRun $candidate
          $baseline = ([string]$env:BASELINE_INPUT).Trim()
          $baselineSha = ''
          if ($baseline) { $baselineSha = Resolve-PackageRun $baseline }
          Write-Host "candidate: package run $candidate ($candidateSha); baseline: $(if ($baseline) { "package run $baseline ($baselineSha)" } else { 'none' })"
          "candidate=$candidate", "candidate_sha=$candidateSha", "baseline=$baseline", "baseline_sha=$baselineSha" |
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Checkout the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download the candidate installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ModelForge-win32-x64-setup
          path: ${{ runner.temp }}\crash-installers\candidate
          run-id: ${{ steps.runs.outputs.candidate }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Download the baseline installer
        if: steps.runs.outputs.baseline != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ModelForge-win32-x64-setup
          path: ${{ runner.temp }}\crash-installers\baseline
          run-id: ${{ steps.runs.outputs.baseline }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      # The test runner's Node, for the fs.cpSync probe (the harness avoids it; harness.ts).
      - name: Set up Node.js (probe only)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.10.0

      - name: Fresh per-user installs, before and after the fix
        id: check
        env:
          ROUNDS: ${{ inputs.crash_check_rounds }}
          PAGE_HEAP_ROUNDS: ${{ inputs.crash_check_page_heap_rounds }}
          CANDIDATE_RUN: ${{ steps.runs.outputs.candidate }}
          CANDIDATE_SHA: ${{ steps.runs.outputs.candidate_sha }}
          BASELINE_RUN: ${{ steps.runs.outputs.baseline }}
          BASELINE_SHA: ${{ steps.runs.outputs.baseline_sha }}
        run: |
          $find = {
            param([string] $dir)
            if (-not (Test-Path -LiteralPath $dir)) { return '' }
            $exe = Get-ChildItem -LiteralPath $dir -Recurse -File -Filter '*Setup*.exe' | Select-Object -First 1
            if ($exe) { return $exe.FullName } else { return '' }
          }
          $candidate = & $find (Join-Path $env:RUNNER_TEMP 'crash-installers\candidate')
          if (-not $candidate) { throw 'candidate installer (*Setup*.exe) not found in the artifact' }
          $baseline = & $find (Join-Path $env:RUNNER_TEMP 'crash-installers\baseline')
          $work = Join-Path $env:RUNNER_TEMP 'mf-crash'
          "CRASH_RESULTS=$(Join-Path $work 'results')" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          $ps51 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $arguments = @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File',
            'ui/desktop/tests/e2e/windows-smoke/scripts/Test-InstallerCrashes.ps1',
            '-CandidateInstaller', $candidate, '-UserName', $env:SMOKE_USER_NAME, '-WorkDir', $work,
            '-Rounds', $env:ROUNDS, '-PageHeapRounds', $env:PAGE_HEAP_ROUNDS, '-NodeExe', (Get-Command node).Source)
          if ($baseline) { $arguments += @('-BaselineInstaller', $baseline) }
          & $ps51 @arguments
          $code = $LASTEXITCODE
          $summary = Join-Path $work 'results\summary.md'
          $head = "candidate: package run $($env:CANDIDATE_RUN) built from ``$($env:CANDIDATE_SHA.Substring(0, 9))``"
          if ($env:BASELINE_RUN) { $head += "; baseline: package run $($env:BASELINE_RUN) built from ``$($env:BASELINE_SHA.Substring(0, 9))``" }
          $head + "`n" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          if (Test-Path -LiteralPath $summary) {
            Get-Content -LiteralPath $summary -Raw -Encoding utf8 | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }
          exit $code

      - name: Upload the crash check results
        if: always() && env.CRASH_RESULTS != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: modelforge-installer-crash-check
          path: ${{ env.CRASH_RESULTS }}
          if-no-files-found: warn
          retention-days: 14
